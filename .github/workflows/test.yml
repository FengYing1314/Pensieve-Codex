name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parity-and-safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run repository checks
        env:
          PENSIEVE_TEST_TMPDIR: ${{ runner.temp }}
          PYTHON_BIN: python
        run: bash .src/scripts/check-repository.sh
